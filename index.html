<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    content="width=device-width,initial-scale=1.0">
    <title>Quize app</title>
    <link rel="stylesheet"href="style.css">
<script src="script.js"></script>
</head>
<body>
 <!-- Main Content-->
 <div class="content">
    <!-- 1st box -->
     <div class="first box">
        <header>
            <h1>QuizMate</h1>
            <p>Learn, Practice and test your knowledge</p>
        </header>
     </div>
    <div class="menu">
    <button id="studyBtn">Study Questions</button>
    <button id="allBtn">All Questions</button>
    <button id="addBtn">Add Question</button>
</div>
  <div class="study-section"id="studyPage">
    <h2>Study Questions</h2>

    <div class="question-box">
        <p>What is HTML?</p>
        <button>Show Answer</button>
    </div>

    <div class="question-box">
        <p>What is CSS?</p>
        <button>Show Answer</button>
    </div>

    <div class="question-box">
        <p>What is JavaScript?</p>
        <button>Show Answer</button>
    </div>

</div>
    <div class="all-questions-section"id="addPage"> 
        <h2>All questions</h2>
        <ul> 
          <li> What is HTML?</li> 
          <li> What is CSS?</li> 
          <li> What is JavaScript?</li> 
        </ul>
    </div>
    <div class="add-question-section"id="addPage">

    <h2>Add New Question</h2>

    <form>
        <label>Enter Your Question:</label>
        <input type="text" placeholder="Write your question">

        <label>Enter Your Answer:</label>
        <input type="text" placeholder="Write your answer">

        <button type="submit">Add Question</button>
    </form>
</div>
 </div>   
    <script src="script.js"></script>
</body>
</html>
